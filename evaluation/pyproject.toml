[tool.poetry]
name = "rag-evaluation"
version = "1.0.0"
description = "Comprehensive evaluation framework for RAG systems"
authors = ["Mohamed Tahiri"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
sentence-transformers = "^5.1.2"
faiss-cpu = "^1.12.0"
numpy = "^2.3.4"
ragas = "^0.3.9"
datasets = "^4.4.1"
langchain = "^0.3.0"
langchain-groq = "^0.3.0"
groq = "^0.33.0"
plotly = "^6.4.0"
pandas = "^2.3.3"
requests = "^2.32.5"
psutil = "^7.1.3"

[tool.poetry.group.dev.dependencies]
# Add development dependencies here if needed

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
